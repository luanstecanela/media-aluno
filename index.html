<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Média do aluno</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,680&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="page">
    <section class="card">
      <p class="eyebrow">Boletim</p>
      <h1>Média do aluno</h1>
      <p class="lead">Informe o nome e as quatro notas, de 0 a 10. A média acima de 7 aprova, de 4 a 7 fica em recuperação e abaixo de 4 reprova.</p>

      <form id="boletim" novalidate>
        <label>
          Nome do aluno
          <input id="nome" name="nome" type="text" autocomplete="name" required placeholder="Ex.: Ana Souza">
        </label>

        <fieldset>
          <legend>Notas</legend>
          <div class="grades">
            <label>
              Nota 1
              <input class="nota" name="nota1" type="number" inputmode="decimal" min="0" max="10" step="0.1" required>
            </label>
            <label>
              Nota 2
              <input class="nota" name="nota2" type="number" inputmode="decimal" min="0" max="10" step="0.1" required>
            </label>
            <label>
              Nota 3
              <input class="nota" name="nota3" type="number" inputmode="decimal" min="0" max="10" step="0.1" required>
            </label>
            <label>
              Nota 4
              <input class="nota" name="nota4" type="number" inputmode="decimal" min="0" max="10" step="0.1" required>
            </label>
          </div>
        </fieldset>

        <p id="erro" class="erro" hidden></p>
        <button type="submit">Calcular média</button>
      </form>
    </section>

    <section id="resultado" class="card resultado" hidden>
      <p class="eyebrow">Resultado</p>
      <h2 id="aluno"></h2>
      <p class="media-linha">Média <strong id="media"></strong></p>
      <p id="situacao" class="situacao"></p>
    </section>
  </main>
  <script src="js/media.js"></script>
</body>
</html>
